name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # Linting and Code Quality
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run ruff linter
        run: |
          uvx ruff check .

      - name: Check code formatting with black
        run: |
          uvx black --check .

  # Run Tests
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          cd src/api-service && uv sync --all-extras

      - name: Run tests
        run: |
          cd src/api-service && uv run pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Detect which services changed
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      api-service: ${{ steps.filter.outputs.api-service }}
      data-collector: ${{ steps.filter.outputs.data-collector }}
      data-processor: ${{ steps.filter.outputs.data-processor }}
      model-training: ${{ steps.filter.outputs.model-training }}
      model-deploy: ${{ steps.filter.outputs.model-deploy }}
      mcp-server: ${{ steps.filter.outputs.mcp-server }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-service:
              - 'src/api-service/**'
            data-collector:
              - 'src/data-collector/**'
            data-processor:
              - 'src/data-processor/**'
            model-training:
              - 'src/model-training/**'
            model-deploy:
              - 'src/model-deploy/**'
            mcp-server:
              - 'src/mcp-server/**'

  # Build Docker Images (only for changed services)
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - api-service
          - data-collector
          - data-processor
          - model-training
          - model-deploy
          - mcp-server

    steps:
      - name: Check if service changed
        id: should-build
        run: |
          SERVICE="${{ matrix.service }}"
          CHANGED="false"

          case "$SERVICE" in
            "api-service")
              if [[ "${{ needs.detect-changes.outputs.api-service }}" == "true" ]]; then
                CHANGED="true"
              fi
              ;;
            "data-collector")
              if [[ "${{ needs.detect-changes.outputs.data-collector }}" == "true" ]]; then
                CHANGED="true"
              fi
              ;;
            "data-processor")
              if [[ "${{ needs.detect-changes.outputs.data-processor }}" == "true" ]]; then
                CHANGED="true"
              fi
              ;;
            "model-training")
              if [[ "${{ needs.detect-changes.outputs.model-training }}" == "true" ]]; then
                CHANGED="true"
              fi
              ;;
            "model-deploy")
              if [[ "${{ needs.detect-changes.outputs.model-deploy }}" == "true" ]]; then
                CHANGED="true"
              fi
              ;;
            "mcp-server")
              if [[ "${{ needs.detect-changes.outputs.mcp-server }}" == "true" ]]; then
                CHANGED="true"
              fi
              ;;
          esac

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Checkout code
        if: steps.should-build.outputs.changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.should-build.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.should-build.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build and push to GCR (only on push to main, requires secrets)
  deploy-images:
    name: Push Images to GCR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Uncomment when you have GCP credentials set up
    # env:
    #   GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
