[project]
name = "model-training"
version = "0.1.0"
description = "ML model training service"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "tensorflow>=2.17.0",
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "python-dotenv>=1.0.0",
    "google-cloud-aiplatform>=1.65.0",
    "google-cloud-storage>=2.18.0",
    "mlflow>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["."]
