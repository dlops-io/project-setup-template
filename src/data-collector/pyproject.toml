[project]
name = "data-collector"
version = "0.1.0"
description = "Data collection service for MLOps project"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["."]
