[project]
name = "model-deploy"
version = "0.1.0"
description = "Model deployment and serving service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "tensorflow>=2.17.0",
    "torch>=2.4.0",
    "python-dotenv>=1.0.0",
    "google-cloud-storage>=2.18.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["."]
